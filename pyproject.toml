[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoonnx"
dynamic = ["version"]
description = "Multilingual TTS and phonemization using ONNX models"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime",
    "quebra-frases",
    "langcodes",
    "ovos-number-parser>=0.4.0",
    "ovos-date-parser>=0.6.4a1",
    "scriptconv[phonemizers]>=0.0.4a23",
    "unicode_rbnf",
    "click",
    "requests",
    "huggingface_hub",
    "json_database",
    "ovos-plugin-manager>=2.1.0",
    "ovos-utils",
    "regex",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/phoonnx"

[project.scripts]
"phoonnx-voices" = "phoonnx.cli:cli"

[project.entry-points."opm.tts"]
"ovos-tts-plugin-phoonnx" = "phoonnx.opm:PhoonnxTTSPlugin"

[project.optional-dependencies]
test = [
    "pytest",
    # the training-engine tests train tiny models end-to-end, so the
    # coverage/test job needs torch; the CPU wheels come from the pinned
    # index below to avoid pulling the multi-GB CUDA build
    "torch>=2.1,<3",
    "torchaudio",
    "pytorch-lightning>=2.0,<3",
    "ovos-plugin-manager>=2.1.0",
    "pycotovia>=0.4.0a1",
    "ahotts-g2p>=0.1.0",
    "espyak>=0.0.3a1",
    "orthography2ipa",
    "arbtok",
    "euskaphone",
    "g2p_barranquenho",
    "mwl_phonemizer",
    # kokoro-family styletts2 voices phonemize through misaki; both extras
    # are pure-python (no heavy/compiled deps) so they belong in the base
    # test extra, not gated behind an importorskip.
    #
    # DEPENDENCY CEILING: misaki's own PyPI metadata declares
    # Requires-Python <3.13,>=3.8 (its "en" extra pulls in spacy, whose
    # "en" chain pulls in blis, which has no Python 3.13/3.14 wheels and
    # fails to build from source there — a Cython/NumPy-C-API break, not
    # something phoonnx or scriptconv can work around). Verified against
    # the actual PR #348 CI failure logs (misaki wheel resolution refuses
    # 3.13/3.14 outright; separately, blis==0.7.11 fails to compile on
    # 3.13 even when forced). Gate with an environment marker rather than
    # skip a runtime check: the corresponding tests in
    # tests/test_scriptconv_phonemizer_coverage.py are
    # skipif(sys.version_info >= (3, 13)) with the same citation, so the
    # extra is either installed-and-tested or provably uninstallable —
    # never silently absent.
    "misaki[en]; python_version<'3.13'",
    "misaki[zh]; python_version<'3.13'",
    # misaki[en]'s own metadata leaves its "spacy" dependency version
    # UNCONSTRAINED. Combined with this repo's CI resolving with
    # UV_PRERELEASE=allow (needed elsewhere for OVOS alpha floor-pins),
    # that let uv pick spacy==4.0.0.dev3 in PR#348's 3.11/3.12 CI runs.
    # 4.0.0.dev3 isn't in spaCy's own model-compatibility table, so
    # misaki.en.G2P()'s `spacy.cli.download("en_core_web_sm")` call hits
    # "No compatible packages found" and does `sys.exit(1)` — surfacing
    # as a bare SystemExit deep inside the phonemize() call, not an
    # ImportError. Pin the same upper bound used by this repo's other
    # spacy-consuming extras (see the `en`/`ja`/`vi`/`zh` extras below)
    # so the [test] extra can't independently drift onto a spaCy
    # prerelease.
    "spacy>=3.7,<4.0; python_version<'3.13'",
    # misaki.zh imports pypinyin.contrib.tone_convert.to_finals, added
    # after 0.44 — older resolved versions (pulled in transitively by
    # espnet/f5-tts) fail at import time with an ImportError
    "pypinyin>=0.50",
    # cross-check reference for the Larynx/Mimic3 tokenization golden tests
    "gruut[en]>=2.3.0,<3.0",
    # reference implementation for tests/test_bpe_reader.py. phoonnx reads
    # tokenizer.json with its own pure-Python reader (phoonnx/_bpe.py) so the
    # install needs no compiled wheel; the test proves the reader returns the
    # same ids as this package, byte for byte. Test-only on purpose — a wrong
    # id makes wrong audio instead of an error, so the comparison must run in
    # CI even though nothing ships it.
    "tokenizers",
    # reference implementation for tests/test_sentencepiece_reader.py. phoonnx
    # reads tokenizer.model with its own pure-Python reader
    # (phoonnx/_sentencepiece.py) so the Pocket TTS install needs no compiled
    # wheel; the test proves the reader returns the same ids as this package.
    # Test-only on purpose — a wrong id makes wrong audio instead of an error,
    # so the comparison must run in CI even though nothing ships it.
    "sentencepiece",
    # onnx uses ml_dtypes.float4_e2m1fn (added in ml_dtypes 0.5) but the
    # resolver can pair it with ml_dtypes 0.4.x, which breaks `import onnx`
    # at collection time; ml_dtypes>=0.5 needs numpy>=2.1 on Python 3.13+,
    # so the split mirrors the [train] numpy markers
    "onnx<1.18; python_version<'3.13'",
    "onnx>=1.18; python_version>='3.13'",
    "ml_dtypes>=0.5; python_version>='3.13'",
    # ground truth for tests/test_kittentts.py's vocab-parity check: lets the
    # test statically extract KittenTTS.__init__'s literal symbol string via
    # ast (no instantiation, no network/hf_hub_download call) and diff it
    # against export_kittentts.py's embedded copy, instead of trusting the
    # "verbatim, copied not retyped" comment on faith. Pure-python, small
    # (espeakng-loader/huggingface-hub/numpy/onnxruntime/phonemizer/
    # soundfile deps), verified installing cleanly alongside this extra.
    "kittentts==0.1.3",
]
# Load-time auto-split of a monolithic VITS model into a streaming
# encoder/decoder pair. Only needed to CREATE a split; a pre-split ("+RT")
# voice streams without it. Requires the full `onnx` package for graph surgery.
streaming = ["onnx"]
espeak = ["espyak>=0.0.3a1"]
matcha = [
    "scipy",
]
# runtime deps for the Pocket TTS engine (phoonnx/engines/pockettts.py):
# safetensors for loading published voice states. The SentencePiece tokenizer
# is read by phoonnx/_sentencepiece.py, so no compiled wheel is needed.
pockettts = [
    "safetensors",
]
# faster/more-faithful silence trimming for the OmniVoice engine's
# remove_silence() (phoonnx/thirdparty/omnivoice/audio.py): when absent it
# falls back to a pure-numpy RMS-window implementation with the same
# contract (leading/trailing/internal silence trimmed to the configured
# padding), so this extra is a quality/perf opt-in, not a hard requirement.
omnivoice = ["pydub"]
# Indic Parler is the one engine whose vocabularies the built-in tokenizer.json
# reader (phoonnx/_bpe.py) cannot read. Its description tokenizer is a T5
# Unigram vocabulary, and its prompt tokenizer — the text actually spoken — is
# BPE with `byte_fallback` and `fuse_unk`, which the reader does not implement
# and therefore declines. Every other tokenizer.json phoonnx loads is plain BPE
# and needs no extra.
indic-parler = ["tokenizers"]
train = [
    # diffusers>=0.36 references torch.xpu at import time, which only exists on
    # torch>=2.4; capping keeps the vendored matcha decoder importable across
    # the whole supported torch>=2.1 range.
    "diffusers>=0.25.0,<0.36",
    "einops",
    "huggingface_hub",
    "librosa>=0.9.2,<1",
    "numpy>=1.19.0,<2; python_version<'3.13'",
    "numpy>=2.1; python_version>='3.13'",
    # librosa's numba dependency: prerelease resolution can pick a stale
    # beta that still references numpy<2 APIs (np.row_stack) at import
    "numba>=0.66; python_version>='3.13'",
    "pytorch-lightning>=2.0,<3",
    "torch>=2.1,<3",
    "tqdm",
    "scipy",
]
# extra deps for the StyleTTS2 training engine
# (phoonnx_train/styletts2/ + phoonnx_train/engines/styletts2*.py) on top of
# [train]: vendored yl4579 model code + PL-BERT/pitch loaders. einops is
# already in [train].
train-styletts2 = [
    "einops-exts",
    "munch",
    "transformers>=4.48",  # PL-BERT backbones (albert / modernbert)
    "torchaudio",
    "soundfile",
    "pandas",
    "PyYAML",
]
# resampling for engines whose features are defined at a fixed sample rate
# (e.g. zipvoice at 24 kHz) when the dataset was preprocessed at another rate
train-resample = [
    "torchaudio",
]
train-eval = [
    "speechonnxmetrics",
    "speechmos",
    "torchaudio",
    "soundfile",
    "speakeronnx",
    "vadonnx",
    "onnx-asr",
    "pandas",
]
# multi-format dataset loading for preprocessing (jsonl/parquet/HF repos with
# embedded audio bytes) and the metrics sidecar
train-data = [
    "pandas",
    "pyarrow",
    "datasets",
    "soundfile",
]
# extra deps for the FastPitch / SpeedySpeech training engine
# (phoonnx_train/engines/fastpitch.py) on top of [train]: F0 (pitch)
# extraction in extra_preprocess uses librosa.pyin, already in [train].
train-fastpitch = []
# extra deps for the Mixer-TTS training engine (phoonnx_train/engines/mixer.py)
# on top of [train]: the shared F0 (pitch) sidecar cache uses librosa.pyin,
# already in [train]. einops (Mixer blocks / aligner) and numba (monotonic
# alignment search) are also already pulled in via [train] (numba
# transitively through librosa on <3.13).
train-mixer = []
# extra deps for the OptiSpeech training engine
# (phoonnx_train/optispeech/ + phoonnx_train/engines/optispeech.py) on top of
# [train]: scipy for pitch interpolation (the pitch extractor itself uses
# librosa.pyin, already in [train]), torchaudio for the vocoder-discriminator
# resampling / STFT losses, and onnx to embed the inference metadata into the
# exported model. The perceptual validation metrics (UTMOS / PESQ /
# periodicity) stay optional and are off by default, so they add no deps here.
train-optispeech = [
    "pyloudnorm",
    "scipy",
    "torchaudio",
    "onnx",
    "opt_einsum",
]
# opt-in WORLD F0 backend (f0_method="dio"/"harvest") for FastPitch,
# Mixer-TTS, StyleTTS2-pitch and OptiSpeech: ~50x faster than the default
# librosa.pyin backend at dataset-preprocessing time. setuptools<81 is
# needed because pyworld imports pkg_resources at runtime.
train-pyworld = [
    "pyworld>=0.3.2",
    "setuptools<81",
]
ar = ["epitran", "arbtok", "text2tashkeel"]
ca = ["epitran"]
gl = ["pycotovia>=0.4.0a1"]
cs = ["epitran"]
de = ["epitran", "gruut[de]>=2.3.0,<3.0"]
en = ["epitran", "gruut[en]>=2.3.0,<3.0", "misaki[en]", "spacy>=3.7,<4.0"]
es = ["epitran"]
eu = ["ahotts-g2p>=0.1.0", "euskaphone"]
fa = ["epitran"]
fr = ["epitran"]
he = ["epitran"]
it = ["epitran"]
ja = ["epitran", "gruut[ja]>=2.3.0,<3.0", "misaki[ja]", "spacy>=3.7,<4.0"]
ko = ["epitran"]
mwl = ["mwl_phonemizer"]
pt = ["epitran", "g2p_barranquenho"]
ru = ["epitran"]
sv = ["epitran"]
sw = ["epitran"]
vi = ["epitran", "gruut[vi]>=2.3.0,<3.0", "misaki[vi]", "spacy>=3.7,<4.0"]
zh = ["epitran", "gruut[zh]>=2.3.0,<3.0", "misaki[zh]", "spacy>=3.7,<4.0"]
cjk = ["pykakasi==2.3.0", "spacy-pkuseg"]

# multilingual data-driven IPA backend (hundreds of language specs)
o2i = ["orthography2ipa"]

# runtime deps for zero-shot voice cloning (reference loading + resampling)
cloning = ["soundfile", "scipy"]
# optional post-synthesis audio super-resolution: upscale any voice to 48 kHz.
# pure-ONNX, no torch at runtime. off by default (see the super_resolution field
# block); models fetch from HuggingFace on first use.
audiosr = ["audiosronnx"]
# Chatterbox multilingual per-language script transforms. ja/zh below; ko is pure-Python
# (built in). he/ru degrade gracefully unless `dicta_onnx` / `russian_text_stresser` are
# also installed (not on clean PyPI, so left out of the extra).
chatterbox-multilingual = ["pykakasi==2.3.0", "spacy-pkuseg"]
# everything optional — every language phonemizer + cloning. Used by the Docker image.
all = [
    # scriptconv splits its phonemizers per language, so the base set
    # alone leaves "all" without Portuguese, Arabic, English, Japanese
    # and Chinese backends, and a voice that asks for one fails at
    # synthesis with an ImportError. The "goruut", "stress" and "pt" extras
    # pull in pygoruut (phoneme_type == "pygoruut" in phoonnx/config.py),
    # stressonnx (Russian stress marks, phoonnx/lang_preprocess.py) and
    # bifonia (scriptconv's own Portuguese backend) respectively — without
    # them a bare `scriptconv[phonemizers,...]` install silently drops those
    # backends and the corresponding voices fail at synthesis time. "he"
    # pulls in phonikud-onnx: phoonnx/config.py routes Hebrew phonemization
    # ("phoneme_type": "phonikud" in the voice_index) through scriptconv,
    # which auto-provisions the phonikud ONNX model, so scriptconv[he] is
    # the correct spelling rather than depending on phonikud-onnx directly.
    # >=0.0.4a23: the release that actually fixes the "he" extra (pulls in
    # both phonikud and phonikud-onnx), the zh alias map, MissingLanguageError,
    # and the stress-routing fix — a19 predates all four.
    "scriptconv[phonemizers,pt-phonemizers,ar-phonemizers,en-phonemizers,ja-phonemizers,zh-phonemizers,tashkeel,goruut,stress,pt,he]>=0.0.4a23",
    # scriptconv's own "stress" extra floors stressonnx at >=0.0.2, which
    # resolves to the latest *stable* release. The BCP-47 language resolver
    # phoonnx needs only shipped in the 0.0.3 alpha train, so it must be
    # floor-pinned here explicitly or a bare-name resolution silently installs
    # the older stable and the resolver is missing.
    "stressonnx>=0.0.3a2",
    "text2tashkeel",
    "epitran",
    # Only the languages the voice_index actually routes through gruut
    # (phoneme_type == "gruut") — de, en, fr, it, nl, ru, es, sv, sw across
    # mimic3/glowtts/fastpitch/coqui_vits voices. ja/vi/zh are kept as-is
    # (misaki/spacy handle those languages; gruut has no ja/vi/zh extra, so
    # those entries are pre-existing no-ops, out of scope here).
    "gruut[de]>=2.3.0,<3.0", "gruut[en]>=2.3.0,<3.0", "gruut[es]>=2.3.0,<3.0",
    "gruut[fr]>=2.3.0,<3.0", "gruut[it]>=2.3.0,<3.0", "gruut[ja]>=2.3.0,<3.0",
    "gruut[nl]>=2.3.0,<3.0", "gruut[ru]>=2.3.0,<3.0", "gruut[sv]>=2.3.0,<3.0",
    "gruut[sw]>=2.3.0,<3.0", "gruut[vi]>=2.3.0,<3.0", "gruut[zh]>=2.3.0,<3.0",
    "misaki[en]", "misaki[ja]", "misaki[vi]", "misaki[zh]",
    "ahotts-g2p>=0.1.0",
    "spacy>=3.7,<4.0",
    "pycotovia>=0.4.0a1",
    "pykakasi==2.3.0", "spacy-pkuseg",
    "soundfile", "scipy",
    "orthography2ipa", "arbtok", "euskaphone", "g2p_barranquenho", "mwl_phonemizer",
    "pydub",
    # Indic Parler needs the compiled reader; `all` is what the image installs,
    # and it carried a working Indic Parler before.
    "tokenizers",
    # test-only reference readers for phoonnx's own pure-Python tokenizer.json
    # / tokenizer.model readers (phoonnx/_bpe.py, phoonnx/_sentencepiece.py):
    # the Docker image ships engines (Indic Parler, Pocket TTS) that route
    # through those readers, so the packages that define the on-disk formats
    # need to be present at runtime too, not just in the [test] extra.
    "sentencepiece",
    # Pocket TTS voice state loading (phoonnx/engines/pockettts.py).
    "safetensors",
    # Griffin-Lim vocoder fallback (phoonnx/engines/vocoders/griffinlim.py).
    "librosa>=0.9.2,<1",
    # streaming VITS model splitting (phoonnx/onnx_surgery.py).
    "onnx<1.23",
    # optional post-synthesis audio super-resolution (phoonnx/voice.py).
    "audiosronnx",
]

[tool.setuptools.dynamic]
version = {attr = "phoonnx.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"phoonnx" = ["**/*"]

[tool.uv]
# CPU-only torch wheels for the test/coverage jobs (avoids the CUDA build)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
