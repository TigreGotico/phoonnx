[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoonnx"
dynamic = ["version"]
description = "Multilingual TTS and phonemization using ONNX models"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime",
    "onnx",
    "quebra-frases",
    "langcodes",
    "ovos-number-parser>=0.4.0",
    "ovos-date-parser>=0.6.4a1",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/phoonnx"

[project.scripts]
"phoonnx-voices" = "phoonnx.cli:cli"

[project.entry-points."opm.tts"]
"ovos-tts-plugin-phoonnx" = "phoonnx.opm:PhoonnxTTSPlugin"

[project.optional-dependencies]
test = [
    "pytest",
    "ovos-plugin-manager>=2.1.0",
    "pycotovia>=0.1.0",
    "ahotts-g2p>=0.1.0",
    "espyak>=0.0.2a1",
    "orthography2ipa",
    "arbtok",
    "euskaphone",
    "g2p_barranquenho",
    "mwl_phonemizer",
]
espeak = ["espyak>=0.0.2a1"]
train = [
    "librosa>=0.9.2,<1",
    "numpy>=1.19.0,<2",
    "pytorch-lightning<2.0",
    "torch>=1.11.0,<2",
]
train-eval = [
    "speechmos",
    "torchaudio",
    "soundfile",
    "speakeronnx",
]
ar = ["epitran", "arbtok"]
ca = ["epitran"]
gl = ["pycotovia>=0.1.0"]
cs = ["epitran"]
de = ["epitran", "gruut[de]>=2.3.0,<3.0"]
en = ["epitran", "gruut[en]>=2.3.0,<3.0", "misaki[en]", "spacy>=3.7"]
es = ["epitran"]
eu = ["ahotts-g2p>=0.1.0", "euskaphone"]
fa = ["epitran"]
fr = ["epitran"]
he = ["epitran"]
it = ["epitran"]
ja = ["epitran", "gruut[ja]>=2.3.0,<3.0", "misaki[ja]", "spacy>=3.7"]
ko = ["epitran"]
mwl = ["mwl_phonemizer"]
pt = ["epitran", "g2p_barranquenho"]
ru = ["epitran"]
sv = ["epitran"]
sw = ["epitran"]
vi = ["epitran", "gruut[vi]>=2.3.0,<3.0", "misaki[vi]", "spacy>=3.7"]
zh = ["epitran", "gruut[zh]>=2.3.0,<3.0", "misaki[zh]", "spacy>=3.7"]

# multilingual data-driven IPA backend (hundreds of language specs)
o2i = ["orthography2ipa"]

# runtime deps for zero-shot voice cloning (reference loading + resampling)
cloning = ["soundfile", "scipy"]
# Chatterbox multilingual per-language script transforms. ja/zh below; ko is pure-Python
# (built in). he/ru degrade gracefully unless `dicta_onnx` / `russian_text_stresser` are
# also installed (not on clean PyPI, so left out of the extra).
chatterbox-multilingual = ["pykakasi==2.3.0", "spacy-pkuseg"]
# everything optional — every language phonemizer + cloning. Used by the Docker image.
all = [
    "epitran",
    "gruut[de]>=2.3.0,<3.0", "gruut[en]>=2.3.0,<3.0", "gruut[ja]>=2.3.0,<3.0",
    "gruut[vi]>=2.3.0,<3.0", "gruut[zh]>=2.3.0,<3.0",
    "misaki[en]", "misaki[ja]", "misaki[vi]", "misaki[zh]",
    "ahotts-g2p>=0.1.0",
    "spacy>=3.7",
    "pycotovia>=0.1.0",
    "pykakasi==2.3.0", "spacy-pkuseg",
    "soundfile", "scipy",
    "orthography2ipa", "arbtok", "euskaphone", "g2p_barranquenho", "mwl_phonemizer",
]

[tool.setuptools.dynamic]
version = {attr = "phoonnx.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"phoonnx" = ["**/*"]
