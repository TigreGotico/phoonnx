[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoonnx"
dynamic = ["version"]
description = "Multilingual TTS and phonemization using ONNX models"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime",
    "quebra-frases",
    "langcodes",
    "ovos-number-parser>=0.4.0",
    "ovos-date-parser>=0.6.4a1",
    "scriptconv[phonemizers]>=0.0.4a18",
    "unicode_rbnf",
    "click",
    "requests",
    "json_database",
    "ovos-plugin-manager>=2.1.0",
    "ovos-utils",
    "regex",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/phoonnx"

[project.scripts]
"phoonnx-voices" = "phoonnx.cli:cli"

[project.entry-points."opm.tts"]
"ovos-tts-plugin-phoonnx" = "phoonnx.opm:PhoonnxTTSPlugin"

[project.optional-dependencies]
test = [
    "pytest",
    # the training-engine tests train tiny models end-to-end, so the
    # coverage/test job needs torch; the CPU wheels come from the pinned
    # index below to avoid pulling the multi-GB CUDA build
    "torch>=2.1,<3",
    "torchaudio",
    "pytorch-lightning>=2.0,<3",
    "ovos-plugin-manager>=2.1.0",
    "pycotovia>=0.1.0",
    "ahotts-g2p>=0.1.0",
    "espyak>=0.0.3a1",
    "orthography2ipa",
    "arbtok",
    "euskaphone",
    "g2p_barranquenho",
    "mwl_phonemizer",
    # cross-check reference for the Larynx/Mimic3 tokenization golden tests
    "gruut[en]>=2.3.0,<3.0",
    # onnx uses ml_dtypes.float4_e2m1fn (added in ml_dtypes 0.5) but the
    # resolver can pair it with ml_dtypes 0.4.x, which breaks `import onnx`
    # at collection time; ml_dtypes>=0.5 needs numpy>=2.1 on Python 3.13+,
    # so the split mirrors the [train] numpy markers
    "onnx<1.18; python_version<'3.13'",
    "onnx>=1.18; python_version>='3.13'",
    "ml_dtypes>=0.5; python_version>='3.13'",
]
# Load-time auto-split of a monolithic VITS model into a streaming
# encoder/decoder pair. Only needed to CREATE a split; a pre-split ("+RT")
# voice streams without it. Requires the full `onnx` package for graph surgery.
streaming = ["onnx"]
espeak = ["espyak>=0.0.3a1"]
matcha = [
    "scipy",
]
train = [
    # diffusers>=0.36 references torch.xpu at import time, which only exists on
    # torch>=2.4; capping keeps the vendored matcha decoder importable across
    # the whole supported torch>=2.1 range.
    "diffusers>=0.25.0,<0.36",
    "einops",
    "huggingface_hub",
    "librosa>=0.9.2,<1",
    "numpy>=1.19.0,<2; python_version<'3.13'",
    "numpy>=2.1; python_version>='3.13'",
    # librosa's numba dependency: prerelease resolution can pick a stale
    # beta that still references numpy<2 APIs (np.row_stack) at import
    "numba>=0.66; python_version>='3.13'",
    "pytorch-lightning>=2.0,<3",
    "torch>=2.1,<3",
    "tqdm",
    "scipy",
]
# extra deps for the StyleTTS2 training engine
# (phoonnx_train/styletts2/ + phoonnx_train/engines/styletts2*.py) on top of
# [train]: vendored yl4579 model code + PL-BERT/pitch loaders. einops is
# already in [train].
train-styletts2 = [
    "einops-exts",
    "munch",
    "transformers>=4.48",  # PL-BERT backbones (albert / modernbert)
    "torchaudio",
    "soundfile",
    "pandas",
    "PyYAML",
]
# resampling for engines whose features are defined at a fixed sample rate
# (e.g. zipvoice at 24 kHz) when the dataset was preprocessed at another rate
train-resample = [
    "torchaudio",
]
train-eval = [
    "speechonnxmetrics",
    "speechmos",
    "torchaudio",
    "soundfile",
    "speakeronnx",
    "vadonnx",
    "onnx-asr",
    "pandas",
]
# multi-format dataset loading for preprocessing (jsonl/parquet/HF repos with
# embedded audio bytes) and the metrics sidecar
train-data = [
    "pandas",
    "pyarrow",
    "datasets",
    "soundfile",
]
# extra deps for the FastPitch / SpeedySpeech training engine
# (phoonnx_train/engines/fastpitch.py) on top of [train]: F0 (pitch)
# extraction in extra_preprocess uses librosa.pyin, already in [train].
train-fastpitch = []
# extra deps for the Mixer-TTS training engine (phoonnx_train/engines/mixer.py)
# on top of [train]: the shared F0 (pitch) sidecar cache uses librosa.pyin,
# already in [train]. einops (Mixer blocks / aligner) and numba (monotonic
# alignment search) are also already pulled in via [train] (numba
# transitively through librosa on <3.13).
train-mixer = []
# extra deps for the OptiSpeech training engine
# (phoonnx_train/optispeech/ + phoonnx_train/engines/optispeech.py) on top of
# [train]: scipy for pitch interpolation (the pitch extractor itself uses
# librosa.pyin, already in [train]), torchaudio for the vocoder-discriminator
# resampling / STFT losses, and onnx to embed the inference metadata into the
# exported model. The perceptual validation metrics (UTMOS / PESQ /
# periodicity) stay optional and are off by default, so they add no deps here.
train-optispeech = [
    "pyloudnorm",
    "scipy",
    "torchaudio",
    "onnx",
    "opt_einsum",
]
# opt-in WORLD F0 backend (f0_method="dio"/"harvest") for FastPitch,
# Mixer-TTS, StyleTTS2-pitch and OptiSpeech: ~50x faster than the default
# librosa.pyin backend at dataset-preprocessing time. setuptools<81 is
# needed because pyworld imports pkg_resources at runtime.
train-pyworld = [
    "pyworld>=0.3.2",
    "setuptools<81",
]
ar = ["epitran", "arbtok", "text2tashkeel"]
ca = ["epitran"]
gl = ["pycotovia>=0.1.0"]
cs = ["epitran"]
de = ["epitran", "gruut[de]>=2.3.0,<3.0"]
en = ["epitran", "gruut[en]>=2.3.0,<3.0", "misaki[en]", "spacy>=3.7"]
es = ["epitran"]
eu = ["ahotts-g2p>=0.1.0", "euskaphone"]
fa = ["epitran"]
fr = ["epitran"]
he = ["epitran"]
it = ["epitran"]
ja = ["epitran", "gruut[ja]>=2.3.0,<3.0", "misaki[ja]", "spacy>=3.7"]
ko = ["epitran"]
mwl = ["mwl_phonemizer"]
pt = ["epitran", "g2p_barranquenho"]
ru = ["epitran"]
sv = ["epitran"]
sw = ["epitran"]
vi = ["epitran", "gruut[vi]>=2.3.0,<3.0", "misaki[vi]", "spacy>=3.7"]
zh = ["epitran", "gruut[zh]>=2.3.0,<3.0", "misaki[zh]", "spacy>=3.7"]
cjk = ["pykakasi==2.3.0", "spacy-pkuseg"]

# multilingual data-driven IPA backend (hundreds of language specs)
o2i = ["orthography2ipa"]

# runtime deps for zero-shot voice cloning (reference loading + resampling)
cloning = ["soundfile", "scipy"]
# optional post-synthesis audio super-resolution: upscale any voice to 48 kHz.
# pure-ONNX, no torch at runtime. off by default (see the super_resolution field
# block); models fetch from HuggingFace on first use.
audiosr = ["audiosronnx"]
# Chatterbox multilingual per-language script transforms. ja/zh below; ko is pure-Python
# (built in). he/ru degrade gracefully unless `dicta_onnx` / `russian_text_stresser` are
# also installed (not on clean PyPI, so left out of the extra).
chatterbox-multilingual = ["pykakasi==2.3.0", "spacy-pkuseg"]
# everything optional — every language phonemizer + cloning. Used by the Docker image.
all = [
    "epitran",
    "gruut[de]>=2.3.0,<3.0", "gruut[en]>=2.3.0,<3.0", "gruut[ja]>=2.3.0,<3.0",
    "gruut[vi]>=2.3.0,<3.0", "gruut[zh]>=2.3.0,<3.0",
    "misaki[en]", "misaki[ja]", "misaki[vi]", "misaki[zh]",
    "ahotts-g2p>=0.1.0",
    "spacy>=3.7",
    "pycotovia>=0.1.0",
    "pykakasi==2.3.0", "spacy-pkuseg",
    "soundfile", "scipy",
    "orthography2ipa", "arbtok", "euskaphone", "g2p_barranquenho", "mwl_phonemizer",
]

[tool.setuptools.dynamic]
version = {attr = "phoonnx.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"phoonnx" = ["**/*"]

[tool.uv]
# CPU-only torch wheels for the test/coverage jobs (avoids the CUDA build)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
