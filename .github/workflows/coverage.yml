name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

# a newer push to the same pull request or branch cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      coverage_source: 'phoonnx'
      test_path: 'tests/'
      install_extras: '-e .[test,train,train-styletts2,train-eval,train-data,train-optispeech,train-pyworld]'
      min_coverage: 43
      system_deps: 'espeak-ng'
      # two workers, as in build-tests.yml
      pytest_args: '-n 2 --dist loadfile'
