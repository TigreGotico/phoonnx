name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  # dev must run this workflow too. `bin/gate ci` classes a red on a pull
  # request as inherited from dev only when dev has a run under the same check
  # names. workflow_dispatch already produces those names, so a baseline is
  # possible without this trigger; it is manual, and there is none unless
  # somebody remembers to press it. The push trigger makes the baseline
  # automatic instead.
  push:
    branches: [dev, master]
  workflow_dispatch:

# a newer push to the same pull request or branch cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.11", "3.12", "3.13", "3.14"]'
      install_extras: 'test,train,train-styletts2,train-eval,train-data,train-optispeech,train-pyworld'
      test_path: 'tests'
      system_deps: 'espeak-ng'
      # one worker per core; a test file stays on one worker, so its module state is not shared
      pytest_args: '-n auto --dist loadfile --durations=20'
