name: Release Alpha and Propose Stable

on:
  workflow_dispatch:
  # pull_request_target, not pull_request: a pull request from a fork gets a
  # read-only token and no secrets under pull_request, so merging one directly
  # could not push the version bump (403) nor publish (#1194). The called
  # workflow checks out only `branch` and the commits it writes, never the
  # pull request's head, and runs only once the pull request is merged.
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish_alpha:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-alpha.yml@dev
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      branch: 'dev'
      version_file: 'phoonnx/version.py'
      update_changelog: true
      publish_prerelease: true
      propose_release: true
      changelog_max_issues: 100
      publish_pypi: true
      notify_matrix: true

