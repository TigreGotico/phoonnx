# auto add labels to PRs
on:
  pull_request_target:
    types: [ opened, edited ]
name: conventional-release-labels
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: bcoe/conventional-release-labels@886f696738527c7be444262c327c89436dfb95a8  # v1.3.1, which the v1 tag points at today
